<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      @keyframes progress {
        0% { stroke-dashoffset: 283; }
        80% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes fly {
        0% { transform: translate(180px, 225px) scale(0.6); opacity: 0; }
        15% { opacity: 1; }
        65% { opacity: 1; }
        80% { transform: translate(620px, 225px) scale(0.6); opacity: 0; }
        100% { transform: translate(620px, 225px) scale(0.6); opacity: 0; }
      }
      @keyframes textPercent {
        0% { content: "0%"; }
        20% { content: "28%"; }
        40% { content: "57%"; }
        60% { content: "84%"; }
        80% { content: "100%"; }
        100% { content: "已送达"; }
      }
      .bg-blob-1 { animation: pulse 8s ease-in-out infinite; }
      .bg-blob-2 { animation: pulse 6s ease-in-out infinite; }
      .progress-bar {
        stroke-dasharray: 283;
        stroke-dashoffset: 283;
        animation: progress 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: center;
        transform: rotate(-90deg);
      }
      .flying-icon {
        animation: fly 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .percent-text::after {
        animation: textPercent 4s steps(1, end) infinite;
        content: "0%";
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#faf9f6"/>
  <circle cx="150" cy="225" r="220" fill="#eae5d9" class="bg-blob-1" filter="blur(60px)"/>
  <circle cx="650" cy="225" r="200" fill="#d5e0ec" class="bg-blob-2" filter="blur(60px)"/>

  <!-- Connection Line -->
  <line x1="200" y1="225" x2="600" y2="225" stroke="rgba(232, 229, 224, 0.8)" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Left Device (Sender - Macbook) -->
  <g transform="translate(100, 175)">
    <rect x="-10" y="5" width="120" height="80" rx="8" fill="#ffffff" stroke="rgba(74, 73, 71, 0.2)" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(30,30,30,0.04))"/>
    <rect x="0" y="12" width="100" height="60" rx="4" fill="#f7f6f2"/>
    <rect x="-25" y="85" width="150" height="6" rx="3" fill="#4a4947"/>
    <rect x="35" y="80" width="30" height="5" fill="#4a4947"/>
    <!-- Laptop screen display content placeholder -->
    <circle cx="50" cy="42" r="14" fill="#eae5d9" opacity="0.6"/>
    <!-- Laptop label -->
    <text x="50" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4a4947">MacBook Pro</text>
  </g>

  <!-- Right Device (Receiver - iPhone) -->
  <g transform="translate(600, 165)">
    <rect width="64" height="120" rx="16" fill="#ffffff" stroke="rgba(74, 73, 71, 0.2)" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(30,30,30,0.04))"/>
    <rect x="5" y="8" width="54" height="104" rx="11" fill="#f7f6f2"/>
    <rect x="22" y="2" width="20" height="4" rx="2" fill="#4a4947"/>
    <!-- Phone label -->
    <text x="32" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4a4947">iPhone 15</text>
  </g>

  <!-- Progress Circle (Center) -->
  <g transform="translate(400, 225)">
    <circle cx="0" cy="0" r="55" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(30,30,30,0.04))"/>
    <!-- Background track -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#e8e5e0" stroke-width="4"/>
    <!-- Active track -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#6b9ab8" stroke-width="4" class="progress-bar"/>
    <!-- Percent Text -->
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4a4947" class="percent-text"></text>
  </g>

  <!-- Flying File Icon -->
  <g class="flying-icon">
    <!-- Circle wrapper -->
    <circle cx="0" cy="0" r="28" fill="#567d56" filter="drop-shadow(0 8px 16px rgba(86,125,86,0.2))"/>
    <!-- File Icon -->
    <g transform="translate(-12, -12) scale(1)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </g>
  </g>
</svg>
