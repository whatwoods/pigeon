<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background with subtle organic color blobs -->
  <rect width="100%" height="100%" fill="#faf9f6"/>
  <circle cx="200" cy="150" r="300" fill="#eae5d9" opacity="0.3" filter="blur(80px)"/>
  <circle cx="600" cy="450" r="250" fill="#d5e0ec" opacity="0.3" filter="blur(80px)"/>

  <!-- Topbar -->
  <g transform="translate(40, 40)">
    <!-- Logo -->
    <circle cx="20" cy="20" r="16" fill="#4a4947"/>
    <g transform="translate(10, 10) scale(0.83)" stroke="#faf9f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"/>
      <path d="M16 8 2 22"/>
      <path d="M17.5 15H9"/>
    </g>
    <text x="48" y="26" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="500" fill="#4a4947">pigeon</text>
    
    <!-- Active Device Pill (Top Right) -->
    <g transform="translate(560, 4)">
      <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(255,255,255,0.6)" stroke="rgba(232, 229, 224, 0.72)" stroke-width="1"/>
      <circle cx="20" cy="16" r="4" fill="#4ade80"/>
      <text x="34" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#4a4947">MY MACBOOK</text>
    </g>
  </g>

  <!-- Glass Card -->
  <g transform="translate(208, 100)">
    <!-- Card shadow and background -->
    <rect width="384" height="460" rx="48" fill="rgba(255,255,255,0.7)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" filter="drop-shadow(0 24px 48px rgba(30,30,30,0.04))"/>
    
    <!-- Card header -->
    <text x="192" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="rgba(74, 73, 71, 0.58)">DEVICE SYNC</text>
    <text x="192" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="rgba(74, 73, 71, 0.7)">Drag files here or tap the orb</text>

    <!-- File Orb -->
    <g transform="translate(192, 210)">
      <!-- Halo -->
      <circle cx="0" cy="0" r="96" fill="rgba(232, 229, 224, 0.4)" filter="blur(10px)"/>
      <!-- Orb Outer -->
      <circle cx="0" cy="0" r="80" fill="#ffffff" stroke="rgba(232, 229, 224, 0.6)" stroke-width="1" filter="drop-shadow(0 16px 32px rgba(30,30,30,0.04))"/>
      <!-- Upload Icon (FileUp) -->
      <g transform="translate(-20, -32) scale(1.6)" stroke="#4a4947" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
        <path d="M20 13v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </g>
      <text x="0" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="rgba(74, 73, 71, 0.62)">CHOOSE FILE</text>
    </g>

    <!-- Device List -->
    <g transform="translate(32, 330)">
      <rect width="320" height="48" rx="24" fill="rgba(255,255,255,0.4)" stroke="rgba(232, 229, 224, 0.5)" stroke-width="1"/>
      <circle cx="24" cy="24" r="14" fill="#faf9f6"/>
      <!-- Smartphone Icon -->
      <g transform="translate(16, 16) scale(0.66)" stroke="#4a4947" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
        <line x1="12" y1="18" x2="12" y2="18"/>
      </g>
      <text x="52" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4a4947">iPhone 15 Pro</text>
      <circle cx="280" cy="24" r="4" fill="#4ade80"/>
      <text x="268" y="28" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="rgba(74, 73, 71, 0.5)">在线</text>
    </g>

    <!-- Actions -->
    <g transform="translate(32, 394)">
      <rect width="320" height="42" rx="21" fill="#4a4947" stroke-width="0"/>
      <text x="160" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Paste from clipboard</text>
    </g>
  </g>
</svg>
