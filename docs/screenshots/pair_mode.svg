<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background with subtle organic color blobs -->
  <rect width="100%" height="100%" fill="#faf9f6"/>
  <circle cx="200" cy="150" r="300" fill="#eae5d9" opacity="0.3" filter="blur(80px)"/>
  <circle cx="600" cy="450" r="250" fill="#d5e0ec" opacity="0.3" filter="blur(80px)"/>

  <!-- Topbar -->
  <g transform="translate(40, 40)">
    <!-- Logo -->
    <circle cx="20" cy="20" r="16" fill="#4a4947"/>
    <g transform="translate(10, 10) scale(0.83)" stroke="#faf9f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"/>
      <path d="M16 8 2 22"/>
      <path d="M17.5 15H9"/>
    </g>
    <text x="48" y="26" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="500" fill="#4a4947">pigeon</text>
    
    <!-- Active Device Pill (Top Right) -->
    <g transform="translate(560, 4)">
      <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(255,255,255,0.6)" stroke="rgba(232, 229, 224, 0.72)" stroke-width="1"/>
      <circle cx="20" cy="16" r="4" fill="#4ade80"/>
      <text x="34" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#4a4947">MY MACBOOK</text>
    </g>
  </g>

  <!-- Glass Card -->
  <g transform="translate(208, 100)">
    <!-- Card shadow and background -->
    <rect width="384" height="460" rx="48" fill="rgba(255,255,255,0.7)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" filter="drop-shadow(0 24px 48px rgba(30,30,30,0.04))"/>
    
    <!-- Card header -->
    <text x="192" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="rgba(74, 73, 71, 0.58)">PAIR TRANSFER</text>
    <text x="192" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="rgba(74, 73, 71, 0.7)">Sharing via 6-digit pair code</text>

    <!-- Code Display Area -->
    <g transform="translate(42, 120)">
      <rect width="300" height="150" rx="24" fill="rgba(255,255,255,0.5)" stroke="rgba(232, 229, 224, 0.6)" stroke-width="1" filter="drop-shadow(0 8px 16px rgba(30,30,30,0.02))"/>
      
      <!-- Pair Code Digits -->
      <g transform="translate(24, 40)">
        <!-- Digit 1 -->
        <rect x="0" y="0" width="36" height="54" rx="8" fill="#ffffff" stroke="rgba(232, 229, 224, 0.8)" stroke-width="1"/>
        <text x="18" y="36" text-anchor="middle" font-family="monospace" font-size="28" font-weight="600" fill="#4a4947">8</text>
        
        <!-- Digit 2 -->
        <rect x="42" y="0" width="36" height="54" rx="8" fill="#ffffff" stroke="rgba(232, 229, 224, 0.8)" stroke-width="1"/>
        <text x="60" y="36" text-anchor="middle" font-family="monospace" font-size="28" font-weight="600" fill="#4a4947">4</text>
        
        <!-- Digit 3 -->
        <rect x="84" y="0" width="36" height="54" rx="8" fill="#ffffff" stroke="rgba(232, 229, 224, 0.8)" stroke-width="1"/>
        <text x="102" y="36" text-anchor="middle" font-family="monospace" font-size="28" font-weight="600" fill="#4a4947">2</text>
        
        <!-- Digit 4 -->
        <rect x="132" y="0" width="36" height="54" rx="8" fill="#ffffff" stroke="rgba(232, 229, 224, 0.8)" stroke-width="1"/>
        <text x="150" y="36" text-anchor="middle" font-family="monospace" font-size="28" font-weight="600" fill="#4a4947">9</text>
        
        <!-- Digit 5 -->
        <rect x="174" y="0" width="36" height="54" rx="8" fill="#ffffff" stroke="rgba(232, 229, 224, 0.8)" stroke-width="1"/>
        <text x="192" y="36" text-anchor="middle" font-family="monospace" font-size="28" font-weight="600" fill="#4a4947">1</text>
        
        <!-- Digit 6 -->
        <rect x="216" y="0" width="36" height="54" rx="8" fill="#ffffff" stroke="rgba(232, 229, 224, 0.8)" stroke-width="1"/>
        <text x="234" y="36" text-anchor="middle" font-family="monospace" font-size="28" font-weight="600" fill="#4a4947">5</text>
      </g>
      
      <text x="150" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="rgba(74, 73, 71, 0.5)">EXPIRES IN 10 MINUTES</text>
    </g>

    <!-- Copy Info -->
    <text x="192" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(74, 73, 71, 0.7)">Or share this link with recipient:</text>
    <text x="192" y="322" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#6b9ab8">https://pigeon.transfer/?code=842915</text>

    <!-- Copy Link Button -->
    <g transform="translate(32, 350)">
      <rect width="320" height="42" rx="21" fill="#ffffff" stroke="rgba(232, 229, 224, 0.8)" stroke-width="1" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.02))"/>
      <!-- Link Copy Icon -->
      <g transform="translate(100, 13) scale(0.75)" stroke="#4a4947" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </g>
      <text x="170" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4a4947">Copy Link</text>
    </g>

    <!-- Cancel Button -->
    <g transform="translate(32, 404)">
      <text x="160" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="rgba(74, 73, 71, 0.5)">CANCEL TRANSFER</text>
    </g>
  </g>
</svg>
